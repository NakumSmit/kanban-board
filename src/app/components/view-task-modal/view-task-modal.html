<div class="modal-overlay" (click)="close()">
    <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>Create Task</h2>
            <button class="close-btn" (click)="close()">
                ✕
            </button>
        </div>
        <div class="modal-body">

            <!-- <form [formGroup]="editTaskForm"> -->

                <label for="title">Title:</label>
                <input type="text" placeholder="{{ task.title }}" formControlName="title">

                    @if(title?.touched && title?.hasError('required')){

                <label for="description">Description:</label>
                <input type="text" placeholder="{{ task.description }}" formControlName="description">
                <!-- <div class="error-container">
                    @if(description?.touched && description?.hasError('required')){

                    @else if(description?.touched && description?.hasError('minlength')){

                <div class="col_2">
                    <div class="priority-container">
                        <label for="priority">Priority:</label>
                        <select formControlName="priority">
                            <option value="" disabled>Select Priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                        <!-- <div class="error-container">
                            @if(priority?.touched && priority?.hasError('required')){

                            }
                        </div> -->

                    <div class="duedate-container">
                        <label for="dueDate">Due Date:</label>
                        <input type="date" placeholder="{{ task.dueDate }}" formControlName="dueDate">
                        <!-- <div class="error-container">
                            @if(dueDate?.touched && dueDate?.hasError('required')){
                            <p class="error-text">Due date is required</p>
                            }
                        </div> -->
                    </div>
                </div>

                <label for="assignedUser">Assigned User:</label>
                <input type="text" placeholder="{{ task.assignedUser }}" formControlName="assignedUser">
                <!-- <div class="error-container">
                    @if(assignedUser?.touched && assignedUser?.hasError('required')){
                    <p class="error-text">Assigned user is required</p>
                    }
                    @else if(assignedUser?.touched && assignedUser?.hasError('pattern')){
                    <p class="error-text">Please enter a valid user name.</p>
                    }
                </div> -->

                <label for="status">Status:</label>
                <select formControlName="status">
                    <option value="" disabled>Select Status</option>
                    <option value="todo" type="Todo">Todo</option>
                    <option value="in-progress">In Progress</option>
                    <option value="testing">Testing</option>
                    <option value="done">Done</option>
                </select>
                <!-- <div class="error-container">
                    @if(status?.touched && status?.hasError('required')){

                    }
                </div> -->


                <div class="modal-footer">
                    <button type="button" class="cancel-btn" (click)="close()">
                        Cancel
                    </button>
                    <button type="submit" class="create-btn">
                        Create Task
                    </button>
                </div>
