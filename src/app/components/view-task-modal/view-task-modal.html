<div class="modal-overlay" (click)="close()">
    <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>Task Details</h2>
            <button class="close-btn" (click)="close()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="field">
                <span class="label">Task Name</span>
                <span class="input">{{ task.title }}</span>
            </div>
            <div class="field">
                <span class="label">Description</span>
                <span class="value">{{ task.description }}</span>
            </div>
            <div class="field-row">
                <div class="field">
                    <span class="label">Status</span>
                    <span class="value">{{ task.status }}</span>
                </div>
                <div class="field">
                    <span class="label">Priority</span>
                    <span class="value" [ngClass]="task.priority">{{ task.priority }}</span>
                </div>
            </div>
            <div class="field">
                <span class="label">Due Date</span>
                <span class="value">{{ task.dueDate }}</span>
            </div>
        </div>
        <div class="modal-footer">
            <button class="cancel-btn" (click)="close()">
                Close
            </button>
        </div>
    </div>
</div>
